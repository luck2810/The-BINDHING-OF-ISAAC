<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mini Isaac Engine - HTML5</title>
    <style>
        body { background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        canvas { background-color: #543d2b; border: 12px solid #3a281c; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="700" height="450"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Estado do Jogador (Isaac)
    let isaac = { x: 350, y: 225, size: 18, speed: 4 };
    let tears = [];
    let keys = {};

    // Escutar comandos do teclado
    window.addEventListener("keydown", e => keys[e.key] = true);
    window.addEventListener("keyup", e => keys[e.key] = false);

    // Sistema de tiro de lágrimas (Setas do teclado)
    window.addEventListener("keydown", e => {
        let dx = 0, dy = 0;
        if (e.key === "ArrowUp") dy = -7;
        if (e.key === "ArrowDown") dy = 7;
        if (e.key === "ArrowLeft") dx = -7;
        if (e.key === "ArrowRight") dx = 7;

        if (dx !== 0 || dy !== 0) {
            tears.push({ x: isaac.x, y: isaac.y, dx: dx, dy: dy, life: 40 });
        }
    });

    function gameLoop() {
        // Movimentação do Isaac (WASD)
        if (keys["w"] || keys["W"]) isaac.y -= isaac.speed;
        if (keys["s"] || keys["S"]) isaac.y += isaac.speed;
        if (keys["a"] || keys["A"]) isaac.x -= isaac.speed;
        if (keys["d"] || keys["D"]) isaac.x += isaac.speed;

        // Limitar o Isaac dentro das paredes da sala
        if (isaac.x < 30) isaac.x = 30;
        if (isaac.x > canvas.width - 30) isaac.x = canvas.width - 30;
        if (isaac.y < 30) isaac.y = 30;
        if (isaac.y > canvas.height - 30) isaac.y = canvas.height - 30;

        // Atualizar Lágrimas
        tears.forEach((tear, index) => {
            tear.x += tear.dx;
            tear.y += tear.dy;
            tear.life--;
            if (tear.life <= 0) tears.splice(index, 1); // Remove a lágrima após um tempo
        });

        // DESENHAR NA TELA
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Desenhar Paredes e Portas simbólicas
        ctx.strokeStyle = "#2e1f15";
        ctx.lineWidth = 25;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);

        // Desenhar as Lágrimas (Tears)
        ctx.fillStyle = "#50bfe6";
        tears.forEach(tear => {
            ctx.beginPath();
            ctx.arc(tear.x, tear.y, 6, 0, Math.PI * 2);
            ctx.fill();
        });

        // Desenhar o Isaac
        ctx.fillStyle = "#fcd0b4"; // Pele
        ctx.beginPath();
        ctx.arc(isaac.x, isaac.y, isaac.size, 0, Math.PI * 2);
        ctx.fill();

        // Olhos e Expressão de choro
        ctx.fillStyle = "#000";
        ctx.fillRect(isaac.x - 7, isaac.y - 6, 4, 6);
        ctx.fillRect(isaac.x + 3, isaac.y - 6, 4, 6);
        
        ctx.fillStyle = "#4fa7ff"; // Rastros de choro fixos no rosto
        ctx.fillRect(isaac.x - 7, isaac.y, 3, 4);
        ctx.fillRect(isaac.x + 4, isaac.y, 3, 4);

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
